<!doctype html><meta charset="utf-8"><title>relay</title>
<script>
(async () => {
  const files = new URLSearchParams(location.search).get('f').split(',');
  const out = [];
  for (const f of files) out.push({name: f, blob: await (await fetch(f)).blob()});
  const origin = new URLSearchParams(location.search).get('o');
  (window.opener || window.parent).postMessage({relay: true, files: out}, origin);
})();
</script>
